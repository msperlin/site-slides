<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Slides — Prof. Marcelo S. Perlin{% endblock %}</title>
    <meta name="description" content="Repositório de slides do Prof. Marcelo S. Perlin: apresentações de Administração Financeira e Análise de Dados Financeiros e Econômicos com o R, em HTML e PDF.">
    <meta name="author" content="Marcelo S. Perlin">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="Slides — Prof. Marcelo S. Perlin">
    <meta property="og:description" content="Apresentações de aula em HTML e PDF, organizadas por disciplina e capítulo.">
    <meta property="og:url" content="{{ site_url }}">
    <link rel="canonical" href="{{ site_url }}">
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="96x96" href="static/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="static/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <script>
        // Aplica o tema antes da pintura para evitar flash
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (error) { /* modo privado */ }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
    <link rel="stylesheet" href="static/site.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Repositório de Slides — Prof. Marcelo S. Perlin",
        "url": {{ site_url|tojson }},
        "inLanguage": "pt-BR",
        "potentialAction": {
            "@type": "SearchAction",
            "target": {{ (site_url ~ "?q={search_term_string}")|tojson }},
            "query-input": "required name=search_term_string"
        }
    }
    </script>
</head>
<body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div class="container">
        <div class="top-nav">
            <button id="theme-toggle" type="button" class="theme-toggle-btn" aria-label="Ativar tema escuro" aria-pressed="false">
                <svg class="sun-icon" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.364 17.636l-.707.707M17.636 17.636l-.707-.707M6.364 6.364l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <svg class="moon-icon" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>
        {% block content %}{% endblock %}
    </div>

    <script src="static/theme.js" defer></script>
</body>
</html>
